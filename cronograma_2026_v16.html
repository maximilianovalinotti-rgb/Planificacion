        el('span', {class: 'projs'}, [c.projects.join(' · ')]),
      ]))),
    ]));
  });
  main.appendChild(grid);
}

// ============ VIEW: PROJECTS (cards by type) ============
function renderProjectsView() {
  const main = $('#main');
  const filters = renderTopFilters();
  if (filters) main.appendChild(filters);

  // Mapa proyecto → personas con sus meses y comentarios
  const map = {};
  state.data.people.forEach(p => {
    p.lanes.forEach(lane => {
      const segs = {};
      lane.forEach((s, idx) => {
        const proj = slotProject(s);
        if (!proj) return;
        const q = Math.floor(idx/WEEKS_PER_MONTH);
        if (!segs[proj]) segs[proj] = { qs: new Set(), comments: new Set() };
        segs[proj].qs.add(q);
        const c = slotComment(s);
        if (c) segs[proj].comments.add(c);
      });
      Object.entries(segs).forEach(([proj, info]) => {
        if (!map[proj]) map[proj] = [];
        map[proj].push({
          name: p.name, category: p.category, personId: p.id,
          mesIdxs: Array.from(info.qs).sort((a,b)=>a-b),
          comments: Array.from(info.comments),
        });
      });
    });
  });

  // Agregar también proyectos del catálogo sin asignaciones
  state.data.projects.forEach(p => { if (!map[p.name]) map[p.name] = []; });

  const projects = Object.keys(map).filter(p => {
    // Filtro de proyectos del multi-select: si hay filtro activo, sólo mostramos los seleccionados
    if (state.activeProjects && !state.activeProjects.has(p)) return false;
    // Búsqueda aplicada
    if (state.searchApplied && !p.toLowerCase().includes(state.searchApplied.toLowerCase()) &&
        !map[p].some(pe => pe.name.toLowerCase().includes(state.searchApplied.toLowerCase()))) return false;
    if (map[p].length === 0) {
      return !state.searchApplied || p.toLowerCase().includes(state.searchApplied.toLowerCase());
    }
    return map[p].some(pe => state.activeCats.has(pe.category));
  });

  if (projects.length === 0) {
    main.appendChild(emptyState('folder_off', 'Aún no hay proyectos',
      state.searchApplied ? 'No hay proyectos que coincidan con los filtros.' : 'Empezá creando un proyecto en la tab "Proyectos" para asignarle recursos.',
      btn('Ir a Proyectos', {raised: true, icon:'folder', onclick: () => { state.view = 'projects-crud'; render(); }})));
    return;
  }

  // Render simple: una sola grilla con todos los proyectos, ordenados alfabéticamente
  const sect = el('section', {class: 'proj-section'});
  sect.appendChild(el('h2', {}, [
    icon('folder'),
    'Proyectos',
    el('span', {class: 'count'}, [`(${projects.length})`]),
  ]));
  const grid = el('div', {class: 'proj-grid'});
  projects.sort().forEach(proj => {
    const people = map[proj].filter(pe => state.activeCats.has(pe.category));
    const allPeople = map[proj];
    const projObj = state.data.projects.find(x => x.name === proj);
    const c = projectColor(proj);

    const card = el('div', {class: 'proj-card', style: `border-top-color: ${c.dark}`});
    const header = el('h3', {}, [
      el('span', {style: 'overflow:hidden;text-overflow:ellipsis;flex:1;display:flex;align-items:center;gap:8px'}, [
        el('span', {style:`display:inline-block;width:10px;height:10px;border-radius:50%;background:${c.dark};flex-shrink:0`}),
        proj,
      ]),
      el('span', {class: 'pcount'}, [`${allPeople.length} pers.`])
    ]);
    card.appendChild(header);

    const actionsRow = el('div', {class: 'actions-row'});
    actionsRow.appendChild(btn('Asignar', {icon:'person_add', onclick: () => openAssignmentDialog({projectName: proj})}));
    if (projObj) {
      actionsRow.appendChild(btn('Editar', {icon:'edit', onclick: () => openProjectDialog(projObj)}));
    }
    card.appendChild(actionsRow);

    if (people.length > 0) {
      const ul = el('ul', {});
      people.forEach(pe => {
        const range = pe.mesIdxs.length === 1
          ? state.data.meses[pe.mesIdxs[0]]
          : `${state.data.meses[pe.mesIdxs[0]]} → ${state.data.meses[pe.mesIdxs[pe.mesIdxs.length-1]]}`;
        const liChildren = [
          el('div', {style:'display:flex;align-items:center;gap:8px;width:100%'}, [
            el('span', {class:'pcat', style: `color:${CAT_COLORS[pe.category]}`}, [pe.category.split(' ')[0]]),
            el('span', {class:'pname'}, [pe.name]),
            el('span', {class:'pq'}, [range]),
          ]),
        ];
        if (pe.comments.length > 0) {
          liChildren.push(el('div', {
            style:'font-size:11px;color:var(--mdc-on-surface-medium);font-style:italic;padding-left:60px;display:flex;align-items:flex-start;gap:4px;margin-top:2px'
          }, [
            el('span', {class:'material-icons', style:'font-size:12px;flex-shrink:0;margin-top:2px'}, ['comment']),
            el('span', {}, [pe.comments.join(' · ')]),
          ]));
        }
        ul.appendChild(el('li', {style: 'flex-direction:column;align-items:flex-start;gap:0'}, liChildren));
      });
      card.appendChild(ul);
    } else {
      card.appendChild(el('div', {style:'margin-top:12px;font-size:12px;color:var(--mdc-on-surface-medium);font-style:italic'}, ['Sin personas asignadas']));
    }
    grid.appendChild(card);
  });
  sect.appendChild(grid);
  main.appendChild(sect);
}

// ============ DIALOG: PROJECT (alta/edición) ============
function openProjectDialog(existing) {
  const isEdit = !!existing;
  const nameField = field({label: 'Nombre del proyecto *', value: existing?.name || ''});

  function save() {
    const name = nameField.value.trim();
    if (!name) { snackbar('El nombre es obligatorio'); return; }
    // Verificar duplicados
    const dup = state.data.projects.find(p => p.name.toLowerCase() === name.toLowerCase() && p.id !== existing?.id);
    if (dup) { snackbar('Ya existe un proyecto con ese nombre'); return; }

    if (isEdit) {
      const oldName = existing.name;
      const newName = name;
      const idx = state.data.projects.findIndex(p => p.id === existing.id);
      state.data.projects[idx] = {...existing, name: newName};
      // Si cambió el nombre, actualizar todas las referencias en lanes
      if (oldName !== newName) {
        state.data.people.forEach(p => p.lanes.forEach(l => {
          for (let i = 0; i < l.length; i++) {
            if (slotProject(l[i]) === oldName) {
              if (typeof l[i] === 'string') l[i] = { project: newName, comment: '' };
              else l[i] = { ...l[i], project: newName };
            }
          }
        }));
      }
      saveState(); closeDialog(); render();
      snackbar('Proyecto actualizado: ' + newName);
    } else {
      const newId = 'p' + (Math.max(0, ...state.data.projects.map(p => parseInt(p.id.slice(1))||0)) + 1);
      state.data.projects.push({id: newId, name});
      saveState(); closeDialog(); render();
      snackbar('Proyecto creado: ' + name, {label: 'ASIGNAR PERSONAS', onclick: () => openAssignmentDialog({projectName: name})});
    }
  }

  // Color preview del proyecto
  const colorPreview = el('div', {style: 'display:flex;align-items:center;gap:8px;margin:8px 0;padding:10px 14px;border:1px solid var(--mdc-divider);border-radius:4px;background:var(--mdc-bg)'}, [
    el('span', {style:'font-size:12px;color:var(--mdc-on-surface-medium)'}, ['Color asignado: ']),
    el('span', {id:'color-preview-swatch', style:'display:inline-block;width:20px;height:20px;border-radius:50%;background:#1976d2'}),
    el('span', {id:'color-preview-name', style:'font-size:13px;font-weight:500'}, ['—']),
  ]);

  function updatePreview() {
    const n = nameField.value.trim();
    if (!n) {
      $('#color-preview-name', colorPreview).textContent = '—';
      $('#color-preview-swatch', colorPreview).style.background = '#ccc';
      return;
    }
    const c = projectColor(n);
    $('#color-preview-name', colorPreview).textContent = n;
    $('#color-preview-swatch', colorPreview).style.background = c.dark;
  }
  nameField.input.addEventListener('input', updatePreview);

  const content = el('div', {}, [
    el('p', {style:'margin-bottom:8px;color:var(--mdc-on-surface-medium);font-size:14px'}, [
      isEdit ? 'Modificá el nombre. Si cambiás el nombre, se actualiza en todas las asignaciones existentes.' : 'Creá un nuevo proyecto. El color se asigna automáticamente. Después podrás asignar recursos y fechas.'
    ]),
    nameField.wrap,
    colorPreview,
  ]);

  dialog({
    title: isEdit ? 'Editar Proyecto' : 'Nuevo Proyecto',
    titleIcon: isEdit ? 'edit' : 'create_new_folder',
    content,
    actions: [
      btn('Cancelar', {onclick: closeDialog}),
      btn(isEdit ? 'Actualizar' : 'Crear', {raised: true, onclick: save}),
    ],
  });

  setTimeout(() => { nameField.input.focus(); updatePreview(); }, 100);
  nameField.input.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
}

function confirmDeleteProject(proj) {
  const stats = getProjectStats(proj.name);
  const content = el('div', {}, [
    el('p', {style:'margin:8px 0'}, [`¿Eliminar el proyecto "${proj.name}"?`]),
    stats.peopleCount > 0 ? el('div', {style:'background:#fff3e0;border-left:4px solid #ff9800;padding:12px;margin:12px 0;font-size:13px'}, [
      el('strong', {}, ['Atención: ']),
      `Este proyecto tiene ${stats.peopleCount} persona(s) asignada(s) en ${stats.quincenaCount} mes(es). Todas esas asignaciones se eliminarán.`
    ]) : null,
  ]);
  dialog({
    title: 'Confirmar eliminación',
    titleIcon: 'delete_forever',
    content,
    actions: [
      btn('Cancelar', {onclick: closeDialog}),
      btn('Eliminar', {raised: true, warn: true, onclick: () => {
        state.data.projects = state.data.projects.filter(p => p.id !== proj.id);
        state.data.people.forEach(p => p.lanes.forEach(l => {
          for (let i = 0; i < l.length; i++) if (slotProject(l[i]) === proj.name) l[i] = null;
        }));
        saveState(); closeDialog(); render();
        snackbar(`Proyecto "${proj.name}" eliminado`);
      }}),
    ],
  });
}

// ============ DIALOG: PERSON (alta/edición) ============
function openPersonDialog(existing) {
  const isEdit = !!existing;
  const nameField = field({label: 'Nombre del recurso *', value: existing?.name || ''});
  // Sección OPCIONAL — agregamos opción vacía al inicio que mapea a "Sin asignar"
  const catField = field({
    label: 'Sección',
    type: 'select',
    value: existing?.category || '',
    options: [
      {value: '', label: '— Sin asignar —'},
      ...CATS.filter(c => c !== 'Sin asignar').map(c => ({value: c, label: c})),
    ],
    hint: 'Opcional. Útil para placeholders cuando todavía no sabés a quién asignar.',
  });
  const lanesField = !isEdit ? field({
    label: 'Carriles iniciales',
    type: 'number',
    value: 1,
    hint: 'Cantidad de carriles paralelos para asignar proyectos. Después podés agregar más.',
  }) : null;

  function save() {
    const name = nameField.value.trim();
    if (!name) { snackbar('El nombre es obligatorio'); return; }
    const dup = state.data.people.find(p => p.name.toLowerCase() === name.toLowerCase() && p.id !== existing?.id);
    if (dup) { snackbar('Ya existe un recurso con ese nombre'); return; }
    // Si no eligió sección, usar la categoría especial "Sin asignar"
    const category = catField.value || 'Sin asignar';

    if (isEdit) {
      const idx = state.data.people.findIndex(p => p.id === existing.id);
      state.data.people[idx] = {...existing, name, category};
      saveState(); closeDialog(); render();
      snackbar('Recurso actualizado: ' + name);
    } else {
      const newId = 'r' + (Math.max(0, ...state.data.people.map(p => parseInt(p.id.slice(1))||0)) + 1);
      const numLanes = Math.max(1, parseInt(lanesField.value) || 1);
      const lanes = Array.from({length: numLanes}, () => Array(32).fill(null));
      state.data.people.push({id: newId, name, category, lanes});
      saveState(); closeDialog(); render();
      snackbar('Recurso creado: ' + name, {label: 'ASIGNAR PROYECTO', onclick: () => openAssignmentDialog({personId: newId})});
    }
  }

  const content = el('div', {}, [
    el('p', {style:'margin-bottom:8px;color:var(--mdc-on-surface-medium);font-size:14px'}, [
      isEdit ? 'Modificá los datos del recurso.' : 'Creá un nuevo recurso. Después podrás asignarle proyectos y fechas.'
    ]),
    nameField.wrap,
    catField.wrap,
    lanesField?.wrap,
  ]);

  dialog({
    title: isEdit ? 'Editar Recurso' : 'Nuevo Recurso',
    titleIcon: isEdit ? 'edit' : 'person_add',
    content,
    actions: [
      btn('Cancelar', {onclick: closeDialog}),
      btn(isEdit ? 'Actualizar' : 'Crear', {raised: true, onclick: save}),
    ],
  });
  setTimeout(() => nameField.input.focus(), 100);
  nameField.input.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
}

function confirmDeletePerson(person) {
  const stats = getPersonStats(person.id);
  const content = el('div', {}, [
    el('p', {style:'margin:8px 0'}, [`¿Eliminar al recurso "${person.name}"?`]),
    stats.assignments > 0 ? el('div', {style:'background:#fff3e0;border-left:4px solid #ff9800;padding:12px;margin:12px 0;font-size:13px'}, [
      el('strong', {}, ['Atención: ']),
      `Este recurso tiene ${stats.assignments} asignación(es) en ${stats.projects} proyecto(s). Todas se perderán.`
    ]) : null,
  ]);
  dialog({
    title: 'Confirmar eliminación',
    titleIcon: 'person_remove',
    content,
    actions: [
      btn('Cancelar', {onclick: closeDialog}),
      btn('Eliminar', {raised: true, warn: true, onclick: () => {
        state.data.people = state.data.people.filter(p => p.id !== person.id);
        saveState(); closeDialog(); render();
        snackbar(`Recurso "${person.name}" eliminado`);
      }}),
    ],
  });
}

// ============ DIALOG: ASSIGNMENT (asignar persona+proyecto+fechas) ============
function openAssignmentDialog(prefill = {}) {
  // prefill puede traer: personId, projectName, laneIdx, start, end
  const isEdit = prefill.personId && prefill.laneIdx != null && prefill.projectName;
  const N_SLOTS = state.data.meses.length * WEEKS_PER_MONTH;

  // ===== Selector de recursos =====
  // En modo edición: single-select tradicional. Las funciones de carril usan personField.value.
  // En modo creación: multi-select. Si hay 1 seleccionado, se comporta similar a single.
  //                   Si hay 2+, se autoasignan carriles y aparecen comentarios por persona.
  const peopleSorted = state.data.people.slice().sort((a, b) =>
    CATS.indexOf(a.category) - CATS.indexOf(b.category) || a.name.localeCompare(b.name)
  );

  // Estado del multi-recurso (sólo en creación)
  // En edición no se usa, pero lo pre-llenamos con el personId del prefill por si el usuario
  // pasa por alguna ruta que lo lea.
  const selectedPeople = new Set(
    isEdit ? [prefill.personId] :
    (prefill.personId ? [prefill.personId] : [])
  );

  // Wrapper que muestra single-select o multi-select según modo
  const personFieldWrap = el('div');
  let personSingleField = null;       // ref al field single (modo edición o ramo legacy)
  let personMultiSelectRef = null;    // ref al multi-select (modo creación)

  function buildPersonSelector() {
    personFieldWrap.innerHTML = '';
    if (isEdit) {
      // Single-select clásico (modo edición)
      const personOpts = [{value: '', label: '— Seleccionar —'}, ...peopleSorted.map(p => ({
        value: p.id, label: `${p.name}  ·  ${p.category}`
      }))];
      personSingleField = field({
        label: 'Recurso *', type: 'select', value: prefill.personId || '',
        options: personOpts,
      });
      personFieldWrap.appendChild(personSingleField.wrap);
      // Cuando cambia, reconstruyo selector de carril
      personSingleField.input.addEventListener('change', () => {
        selectedPeople.clear();
        if (personSingleField.value) selectedPeople.add(personSingleField.value);
        buildLaneSelector();
        buildCommentSection();
      });
    } else {
      // Multi-select (modo creación)
      const items = peopleSorted.map(p => ({
        value: p.id,
        label: `${p.name} · ${p.category}`,
        color: CAT_COLORS[p.category],
      }));
      const ms = multiSelect({
        label: 'Recursos',
        items,
        selected: selectedPeople,
        onChange: () => {
          buildLaneSelector();
          buildCommentSection();
        },
        allLabel: 'todos',
      });
      ms.wrap.style.display = 'block';
      ms.wrap.style.marginTop = '8px';
      ms.wrap.style.marginBottom = '4px';
      // Etiqueta arriba (estilo similar a un field)
      const lbl = el('label', {
        style: 'display:block;font-size:12px;color:var(--mdc-on-surface-medium);margin-bottom:4px;font-weight:500;letter-spacing:0.4px',
      }, ['Recursos *']);
      personFieldWrap.appendChild(lbl);
      personFieldWrap.appendChild(ms.wrap);
      // Hint
      personFieldWrap.appendChild(el('div', {
        style: 'font-size:12px;color:var(--mdc-on-surface-medium);padding:4px 14px',
      }, ['Podés seleccionar uno o varios recursos. El carril se asigna automáticamente para cada uno.']));
      personMultiSelectRef = ms;
    }
  }

  // ===== Selector de carril (sólo cuando hay 0-1 recursos seleccionados) =====
  const laneFieldWrap = el('div');

  function buildLaneSelector() {
    laneFieldWrap.innerHTML = '';
    if (selectedPeople.size !== 1) return; // 0 o 2+ → no mostrar selector
    const pid = Array.from(selectedPeople)[0];
    const person = state.data.people.find(p => p.id === pid);
    if (!person) return;
    const opts = person.lanes.map((_, i) => ({value: i, label: `Carril ${i+1}`}));
    opts.push({value: 'new', label: '+ Crear nuevo carril paralelo'});
    // Default: el laneIdx del prefill si existe y es válido para ESTA persona
    const defLane = (prefill.personId === pid && prefill.laneIdx != null) ? prefill.laneIdx : 0;
    const lf = field({
      label: 'Carril *', type: 'select', value: defLane,
      options: opts,
    });
    laneFieldWrap.appendChild(lf.wrap);
    laneFieldWrap._field = lf;
  }

  // ===== Sección de comentarios =====
  // - 0 recursos: sólo el comentario común (informativo, no se aplica a nada)
  // - 1 recurso: un comentario común
  // - 2+ recursos: un comentario por persona, cada uno con el nombre como prefijo
  const commentSectionWrap = el('div');
  // Estado: mapa personId → string. Se conserva entre rebuilds para no perder lo tipeado.
  const commentByPerson = {};
  if (prefill.comment && prefill.personId) commentByPerson[prefill.personId] = prefill.comment;
  let singleCommentField = null;

  function buildCommentSection() {
    commentSectionWrap.innerHTML = '';
    if (selectedPeople.size <= 1) {
      // Modo simple: un comentario común
      const v = singleCommentField ? singleCommentField.value :
        (selectedPeople.size === 1 ? (commentByPerson[Array.from(selectedPeople)[0]] || '') : (prefill.comment || ''));
      singleCommentField = field({
        label: 'Comentario',
        type: 'textarea',
        value: v,
        hint: 'Opcional. Aparece junto al nombre del proyecto en el cronograma y en el Excel.',
      });
      commentSectionWrap.appendChild(singleCommentField.wrap);
    } else {
      // Modo múltiple: un comentario por persona
      commentSectionWrap.appendChild(el('div', {
        style: 'margin:12px 0 8px;font-size:13px;color:var(--mdc-on-surface-medium);font-weight:500',
      }, [`Comentarios por recurso (${selectedPeople.size}):`]));
      const grid = el('div', {style: 'display:flex;flex-direction:column;gap:8px'});
      const ordered = peopleSorted.filter(p => selectedPeople.has(p.id));
      ordered.forEach(p => {
        const wrap = el('div', {style: 'display:flex;gap:8px;align-items:flex-start'});
        wrap.appendChild(el('div', {
          style: 'min-width:150px;padding-top:14px;font-size:13px;color:var(--mdc-on-surface)',
        }, [
          el('strong', {}, [p.name]),
          el('div', {style:'font-size:11px;color:var(--mdc-on-surface-medium)'}, [p.category]),
        ]));
        const input = el('input', {
          type: 'text',
          value: commentByPerson[p.id] || '',
          placeholder: 'Comentario (opcional)',
          oninput: (e) => { commentByPerson[p.id] = e.target.value; },
          style: 'flex:1;height:40px;padding:0 14px;border:1px solid rgba(0,0,0,0.38);border-radius:4px;font:400 14px/24px Roboto;outline:none;',
        });
        input.addEventListener('focus', () => { input.style.border = '2px solid var(--mdc-primary)'; input.style.padding = '0 13px'; });
        input.addEventListener('blur', () => { input.style.border = '1px solid rgba(0,0,0,0.38)'; input.style.padding = '0 14px'; });
        wrap.appendChild(input);
        grid.appendChild(wrap);
      });
      commentSectionWrap.appendChild(grid);
    }
  }

  // ===== Proyecto =====
  const projField = field({
    label: 'Proyecto *', value: prefill.projectName || '',
    autocompleteData: state.data.projects.map(p => ({name: p.name})),
    onAutocomplete: (val, isNew) => {},
    hint: 'Escribí para buscar o crear nuevo'
  });

  // ===== Slots (desde / hasta) - end es INCLUSIVO en la UI =====
  const slotOpts = [];
  for (let i = 0; i < N_SLOTS; i++) {
    slotOpts.push({value: i, label: `${state.data.meses[Math.floor(i/WEEKS_PER_MONTH)]} · ${WEEK_LABELS[i % WEEKS_PER_MONTH]}`});
  }
  const defStart = prefill.start != null ? prefill.start : 0;
  const defEndIncl = prefill.end != null ? prefill.end - 1 : defStart + 1;
  const startField = field({
    label: 'Desde *', type: 'select', value: defStart,
    options: slotOpts,
  });
  const endField = field({
    label: 'Hasta *', type: 'select', value: defEndIncl,
    options: slotOpts,
    hint: 'Inclusivo — la asignación cubre desde el primero al último, ambos incluidos',
  });

  // Construcción inicial
  buildPersonSelector();
  buildLaneSelector();
  buildCommentSection();

  function save() {
    const projectName = projField.value.trim();
    if (!projectName) { snackbar('Indicá un proyecto'); return; }
    const start = parseInt(startField.value);
    const endIncl = parseInt(endField.value);
    const end = endIncl + 1;
    if (end <= start) { snackbar('"Hasta" debe ser igual o posterior a "Desde"'); return; }

    if (selectedPeople.size === 0) { snackbar('Seleccioná al menos un recurso'); return; }

    // Crear proyecto si no existe
    let projObj = state.data.projects.find(p => p.name.toLowerCase() === projectName.toLowerCase());
    if (!projObj) {
      const newId = 'p' + (Math.max(0, ...state.data.projects.map(p => parseInt(p.id.slice(1))||0)) + 1);
      projObj = {id: newId, name: projectName};
      state.data.projects.push(projObj);
    }

    // Helper: ¿el rango [start, end) en el carril `lane` está libre?
    function isRangeFree(lane, start, end) {
      for (let i = start; i < end; i++) if (lane[i]) return false;
      return true;
    }

    // ===== Modo edición: single recurso, lógica idéntica al original =====
    if (isEdit) {
      const personId = personSingleField.value;
      if (!personId) { snackbar('Seleccioná un recurso'); return; }
      const laneSel = laneFieldWrap._field?.value;
      if (laneSel == null || laneSel === '') { snackbar('Seleccioná un carril'); return; }
      const comment = (singleCommentField?.value || '').trim();

      const person = state.data.people.find(p => p.id === personId);
      let laneIdx;
      if (laneSel === 'new') {
        person.lanes.push(Array(N_SLOTS).fill(null));
        laneIdx = person.lanes.length - 1;
      } else {
        laneIdx = parseInt(laneSel);
      }

      // Limpiar el rango original si está en el mismo carril
      if (prefill.personId === personId && prefill.laneIdx === laneIdx) {
        const lane = person.lanes[prefill.laneIdx];
        for (let i = prefill.start; i < prefill.end; i++) {
          if (slotProject(lane[i]) === prefill.projectName) lane[i] = null;
        }
      }
      const slotObj = { project: projObj.name, comment };
      const lane = person.lanes[laneIdx];
      for (let i = start; i < end; i++) lane[i] = slotObj;

      saveState(); closeDialog(); render();
      snackbar('Asignación actualizada');
      return;
    }

    // ===== Modo creación: 1 o N recursos =====
    // Si hay 1 recurso seleccionado y el usuario eligió un carril específico, lo respetamos.
    // Si hay 1 sin selector de carril visible (caso raro) o si hay >1, usamos auto-asignación.
    const singleLaneSel = (selectedPeople.size === 1 && laneFieldWrap._field) ? laneFieldWrap._field.value : null;

    const newLanesOpened = []; // recursos a los que se les abrió un carril nuevo
    const placedNormally = []; // recursos que fueron al carril seleccionado o existente libre

    Array.from(selectedPeople).forEach(personId => {
      const person = state.data.people.find(p => p.id === personId);
      if (!person) return;

      // Determinar comentario para esta persona
      const comment = (selectedPeople.size === 1)
        ? (singleCommentField?.value || '').trim()
        : (commentByPerson[personId] || '').trim();

      // Determinar carril
      let laneIdx;
      if (selectedPeople.size === 1 && singleLaneSel != null && singleLaneSel !== '') {
        // Usuario eligió explícitamente un carril
        if (singleLaneSel === 'new') {
          person.lanes.push(Array(N_SLOTS).fill(null));
          laneIdx = person.lanes.length - 1;
          newLanesOpened.push(person.name);
        } else {
          laneIdx = parseInt(singleLaneSel);
          placedNormally.push(person.name);
        }
      } else {
        // Auto-asignación: primer carril donde el rango esté libre, sino crear nuevo
        let placedLane = -1;
        for (let li = 0; li < person.lanes.length; li++) {
          if (isRangeFree(person.lanes[li], start, end)) {
            placedLane = li;
            break;
          }
        }
        if (placedLane === -1) {
          person.lanes.push(Array(N_SLOTS).fill(null));
          laneIdx = person.lanes.length - 1;
          newLanesOpened.push(person.name);
        } else {
          laneIdx = placedLane;
          placedNormally.push(person.name);
        }
      }

      // Asignar — slots reciben la misma referencia
      const slotObj = { project: projObj.name, comment };
      const lane = person.lanes[laneIdx];
      for (let i = start; i < end; i++) lane[i] = slotObj;
    });

    saveState(); closeDialog(); render();

    // Snackbar resumen
    const total = selectedPeople.size;
    if (total === 1) {
      snackbar('Asignación creada');
    } else if (newLanesOpened.length === 0) {
      snackbar(`Asignación creada para ${total} recursos`);
    } else if (newLanesOpened.length === total) {
      snackbar(`${total} recursos asignados — a todos se les abrió un carril paralelo`);
    } else {
      snackbar(
        `${total} recursos asignados. ${newLanesOpened.length} ya tenían algo en esas fechas y se les abrió un carril paralelo: ${newLanesOpened.join(', ')}`,
        { label: 'OK', onclick: () => {} }
      );
    }
  }

  function deleteAssign() {
    if (!isEdit) return;
    const person = state.data.people.find(p => p.id === prefill.personId);
    const lane = person.lanes[prefill.laneIdx];
    for (let i = prefill.start; i < prefill.end; i++) {
      if (slotProject(lane[i]) === prefill.projectName) lane[i] = null;
    }
    saveState(); closeDialog(); render();
    snackbar('Asignación eliminada');
  }

  const content = el('div', {}, [
    el('p', {style:'margin-bottom:8px;color:var(--mdc-on-surface-medium);font-size:14px'}, [
      isEdit
        ? 'Modificá los datos de la asignación.'
        : 'Asigná uno o varios recursos al mismo proyecto en un rango de semanas. Si elegís más de uno, el carril se asigna automáticamente para cada uno.'
    ]),
    personFieldWrap,
    laneFieldWrap,
    projField.wrap,
    commentSectionWrap,
    el('div', {style:'display:grid;grid-template-columns:1fr 1fr;gap:12px'}, [
      startField.wrap,
      endField.wrap,
    ]),
  ]);

  const actions = [];
  if (isEdit) actions.push(btn('Eliminar', {warn: true, icon:'delete', onclick: deleteAssign}));
  actions.push(btn('Cancelar', {onclick: closeDialog}));
  actions.push(btn(isEdit ? 'Actualizar' : 'Asignar', {raised: true, onclick: save}));

  dialog({
    title: isEdit ? 'Editar Asignación' : 'Nueva Asignación',
    titleIcon: isEdit ? 'edit_calendar' : 'event_available',
    content,
    actions,
    lg: true,
  });
}

  event?.stopPropagation();

  const rect = anchor.getBoundingClientRect();
  const menu = el('div', {

  }, [

      icon('table_view'),

      ]),
    ]),
    el('button', {class: 'mat-menu-item', onclick: () => { closeMenu(); exportCSV(); }}, [
      icon('description'),
      el('div', {class: 'mat-menu-item-content'}, [
        el('span', {}, ['CSV (asignaciones)']),
        el('span', {class: 'mat-menu-item-hint'}, ['Formato plano para Notion / Airtable']),
      ]),
    ]),
    el('div', {class: 'mat-menu-divider'}),
    el('button', {class: 'mat-menu-item', onclick: () => { closeMenu(); exportJSON(); }}, [
      icon('code'),
      el('div', {class: 'mat-menu-item-content'}, [
        el('span', {}, ['JSON (backup)']),
        el('span', {class: 'mat-menu-item-hint'}, ['Estructura completa para reimportar']),

  document.body.appendChild(menu);

  function closeMenu() { menu.remove(); document.removeEventListener('click', onDocClick); }

  setTimeout(() => document.addEventListener('click', onDocClick), 0);
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

// ============ IMPORT XLSX ============
async function importXLSX() {
  if (typeof ExcelJS === 'undefined') {
    snackbar('La librería de Excel aún se está cargando, intentá de nuevo en un segundo');
    return;
  }
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.xlsx,.xls';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.onchange = async () => {
    const file = input.files[0];
    document.body.removeChild(input);
    if (!file) return;
    try {
      snackbar('Leyendo archivo Excel...');
      const buffer = await file.arrayBuffer();
      const wb = new ExcelJS.Workbook();
      await wb.xlsx.load(buffer);
      const parsed = parseImportedWorkbook(wb);
      showImportPreview(parsed, file.name);
    } catch (e) {
      console.error(e);
      snackbar('Error al leer el archivo: ' + e.message);
    }
  };
  input.click();
}

function parseImportedWorkbook(wb) {
  const result = {
    meses: null,
    projects: [],
    people: [],
    assignments: [],
    warnings: [],
  };

  // ===== Hoja Recursos =====
  const wsR = wb.getWorksheet('Recursos');
  if (!wsR) {
    result.warnings.push('No se encontró la hoja "Recursos". Se mantendrán los recursos actuales.');
  } else {
    // Validar header
    const hdr = wsR.getRow(1);
    if (String(hdr.getCell(1).value || '').toLowerCase() !== 'id') {
      result.warnings.push('La hoja "Recursos" no tiene el formato esperado (header).');
    }
    wsR.eachRow((row, rNum) => {
      if (rNum === 1) return;
      const id = String(row.getCell(1).value || '').trim();
      const name = String(row.getCell(2).value || '').trim();
      const cat = String(row.getCell(3).value || '').trim();
      if (!name) return;
      if (cat && !CATS.includes(cat)) {
        result.warnings.push(`Recurso "${name}" tiene sección "${cat}" no reconocida. Se asigna a "Sin asignar".`);
      }
      result.people.push({
        id: id || ('r' + (result.people.length + 1)),
        name,
        category: CATS.includes(cat) ? cat : 'Sin asignar',
      });
    });
  }

  // ===== Hoja Proyectos =====
  const wsP = wb.getWorksheet('Proyectos');
  if (!wsP) {
    result.warnings.push('No se encontró la hoja "Proyectos". Se reconstruirá desde las asignaciones.');
  } else {
    wsP.eachRow((row, rNum) => {
      if (rNum === 1) return;
      const id = String(row.getCell(1).value || '').trim();
      const name = String(row.getCell(2).value || '').trim();
      if (!name) return;
      result.projects.push({
        id: id || ('p' + (result.projects.length + 1)),
        name,
      });
    });
  }

  // ===== Hoja Asignaciones =====
  const wsA = wb.getWorksheet('Asignaciones');
  if (!wsA) {
    throw new Error('No se encontró la hoja "Asignaciones". El archivo no parece ser un export válido del cronograma.');
  }
  // Validar header
  const hdrA = wsA.getRow(1);
  const headers = [];
  for (let c = 1; c <= 7; c++) {
    headers.push(String(hdrA.getCell(c).value || '').toLowerCase().trim());
  }
  // Acepta tanto el v3 (sin Comentario) como el v4+ (con Comentario)
  const hasComment = headers[3] === 'comentario';
  const colP = 1, colC = 2, colPr = 3;
  const colCm = hasComment ? 4 : null;
  const colQ = hasComment ? 5 : 4;
  const colS = hasComment ? 6 : 5;
  const colSlot = hasComment ? 7 : 6;

  wsA.eachRow((row, rNum) => {
    if (rNum === 1) return;
    const personName = String(row.getCell(colP).value || '').trim();
    const cat = String(row.getCell(colC).value || '').trim();
    const project = String(row.getCell(colPr).value || '').trim();
    const comment = colCm ? String(row.getCell(colCm).value || '').trim() : '';
    const quincena = String(row.getCell(colQ).value || '').trim();
    const slotRaw = row.getCell(colSlot).value;
    const slot = parseInt(slotRaw);
    if (!personName || !project || isNaN(slot)) return;
    result.assignments.push({ personName, category: cat, project, comment, quincena, slot });
  });

  // ===== Derivar meses desde Asignaciones =====
  // Cada mes ocupa WEEKS_PER_MONTH (=4) slots. Slot 0-3 → mes 0, slot 4-7 → mes 1, etc.
  // Si el Excel viene del modelo viejo (quincenas), el campo "Quincena" trae "1Q May", "2Q May", "1Q Jun", ...
  // Limpiamos el prefijo "1Q "/"2Q " para extraer solo el nombre del mes.
  function cleanMonthName(raw) {
    if (!raw) return null;
    // Quitar "1Q ", "2Q " del inicio (insensible a mayúsculas)
    const cleaned = String(raw).replace(/^\s*[12]\s*Q\s+/i, '').trim();
    return cleaned || null;
  }
  const monthMap = new Map();
  result.assignments.forEach(a => {
    const monthIdx = Math.floor(a.slot / WEEKS_PER_MONTH);
    if (!monthMap.has(monthIdx)) {
      const name = cleanMonthName(a.quincena);
      if (name) monthMap.set(monthIdx, name);
    }
  });
  if (monthMap.size === 0) {
    // Sin asignaciones: mantener meses actuales
    result.meses = [...state.data.meses];
  } else {
    const maxM = Math.max(...monthMap.keys());
    const numMeses = Math.max(state.data.meses.length, maxM + 1);
    const meses = [];
    for (let i = 0; i < numMeses; i++) {
      if (monthMap.has(i)) meses.push(monthMap.get(i));
      else if (state.data.meses[i]) meses.push(state.data.meses[i]);
      else meses.push(`M${i+1}`);
    }
    result.meses = meses;
  }

  // ===== Reconstruir personas si faltan, agregando las que sólo aparecen en Asignaciones =====
  const peopleByName = new Map(result.people.map(p => [p.name, p]));
  result.assignments.forEach(a => {
    if (!peopleByName.has(a.personName)) {
      const newPerson = {
        id: 'r' + (result.people.length + 1),
        name: a.personName,
        category: CATS.includes(a.category) ? a.category : 'Sin asignar',
      };
      result.people.push(newPerson);
      peopleByName.set(a.personName, newPerson);
      result.warnings.push(`Recurso "${a.personName}" no estaba en la hoja Recursos pero aparece en Asignaciones. Se agregó automáticamente.`);
    }
  });

  // ===== Reconstruir proyectos si faltan =====
  const projsByName = new Map(result.projects.map(p => [p.name.toLowerCase(), p]));
  result.assignments.forEach(a => {
    if (!projsByName.has(a.project.toLowerCase())) {
      const newProj = { id: 'p' + (result.projects.length + 1), name: a.project };
      result.projects.push(newProj);
      projsByName.set(a.project.toLowerCase(), newProj);
    }
  });

  // ===== Reconstruir lanes para cada persona (algoritmo greedy de carriles) =====
  const N_SLOTS = result.meses.length * WEEKS_PER_MONTH;
  result.people.forEach(person => {
    person.lanes = [Array(N_SLOTS).fill(null)];
  });
  const peopleById = new Map(result.people.map(p => [p.name, p]));

  // Agrupar asignaciones por (persona, project, comment) para mantener cada bloque junto
  const groups = new Map(); // personName → Map(key → {project, comment, slots:Set})
  result.assignments.forEach(a => {
    if (!groups.has(a.personName)) groups.set(a.personName, new Map());
    const pm = groups.get(a.personName);
    const key = `${a.project}||${a.comment}`;
    if (!pm.has(key)) pm.set(key, { project: a.project, comment: a.comment, slots: new Set() });
    pm.get(key).slots.add(a.slot);
  });

  // Para cada grupo, encontrar el primer carril donde TODOS sus slots están libres
  groups.forEach((pm, personName) => {
    const person = peopleById.get(personName);
    if (!person) return;
    pm.forEach(group => {
      let placedLane = -1;
      for (let li = 0; li < person.lanes.length; li++) {
        const lane = person.lanes[li];
        let canPlace = true;
        for (const slot of group.slots) {
          if (slot >= N_SLOTS) { canPlace = false; break; }
          if (lane[slot] !== null) { canPlace = false; break; }
        }
        if (canPlace) { placedLane = li; break; }
      }
      if (placedLane === -1) {
        person.lanes.push(Array(N_SLOTS).fill(null));
        placedLane = person.lanes.length - 1;
      }
      const slotObj = { project: group.project, comment: group.comment };
      group.slots.forEach(slot => {
        if (slot < N_SLOTS) person.lanes[placedLane][slot] = slotObj;
      });
    });
  });

  return result;
}

function showImportPreview(parsed, filename) {
  const totalAssignments = parsed.assignments.length;

  const summaryItems = [
    ['Meses', parsed.meses.length, parsed.meses.length === state.data.meses.length ? null : 'distinto al actual'],
    ['Recursos', parsed.people.length, null],
    ['Proyectos', parsed.projects.length, null],
    ['Asignaciones', totalAssignments, null],
  ];

  const summary = el('div', {style: 'background:var(--mdc-bg);border-radius:4px;padding:14px;margin:8px 0'}, [
    el('div', {style:'font-weight:500;margin-bottom:8px'}, [`Archivo: ${filename}`]),
    el('div', {style:'display:grid;grid-template-columns:repeat(2, 1fr);gap:8px'},
      summaryItems.map(([lbl, val, hint]) => el('div', {style:'display:flex;justify-content:space-between;font-size:13px'}, [
        el('span', {style:'color:var(--mdc-on-surface-medium)'}, [lbl]),
        el('span', {}, [
          el('strong', {}, [String(val)]),
          hint ? el('span', {style:'font-size:11px;color:var(--mdc-warn);margin-left:6px'}, [`(${hint})`]) : null,
        ]),
      ]))
    ),
  ]);

  let warningsBox = null;
  if (parsed.warnings.length > 0) {
    warningsBox = el('div', {style:'background:#fff3e0;border-left:4px solid #ff9800;padding:10px 14px;margin:12px 0;font-size:13px;border-radius:2px'}, [
      el('strong', {}, ['Avisos:']),
      el('ul', {style:'margin:6px 0 0 18px'}, parsed.warnings.map(w => el('li', {style:'margin:2px 0'}, [w]))),
    ]);
  }

  // Sample de los primeros recursos y proyectos para que el usuario verifique
  const sampleRecs = parsed.people.slice(0, 5).map(p => p.name).join(', ');
  const sampleProjs = parsed.projects.slice(0, 5).map(p => p.name).join(', ');

  const content = el('div', {}, [
    el('p', {style:'color:var(--mdc-on-surface-medium);font-size:14px;margin-bottom:8px'}, [
      'Se reemplazarán todos los datos actuales con los del archivo. Los datos actuales se guardan automáticamente como backup por si querés deshacer.'
    ]),
    summary,
    warningsBox,
    parsed.people.length > 0 ? el('div', {style:'margin:12px 0;font-size:13px'}, [
      el('div', {style:'color:var(--mdc-on-surface-medium);margin-bottom:4px'}, ['Primeros recursos:']),
      el('div', {style:'font-family:monospace;font-size:12px'}, [sampleRecs + (parsed.people.length > 5 ? `, ... (+${parsed.people.length - 5} más)` : '')]),
    ]) : null,
    parsed.projects.length > 0 ? el('div', {style:'margin:8px 0;font-size:13px'}, [
      el('div', {style:'color:var(--mdc-on-surface-medium);margin-bottom:4px'}, ['Primeros proyectos:']),
      el('div', {style:'font-family:monospace;font-size:12px'}, [sampleProjs + (parsed.projects.length > 5 ? `, ... (+${parsed.projects.length - 5} más)` : '')]),
    ]) : null,
  ]);

  function applyImport() {
    // Backup automático del estado actual antes de sobreescribir
    try {
      localStorage.setItem('i2t_planning_v4_backup', JSON.stringify(state.data));
    } catch(e) {}
    state.data = {
      meses: parsed.meses,
      projects: parsed.projects,
      people: parsed.people,
    };
    saveState();
    closeDialog();
    render();
    snackbar(`Importación completa: ${parsed.people.length} recursos, ${parsed.projects.length} proyectos, ${parsed.assignments.length} asignaciones`, {
      label: 'DESHACER', onclick: undoImport
    });
  }

  dialog({
    title: 'Importar desde Excel',
    titleIcon: 'upload_file',
    content,
    actions: [
      btn('Cancelar', {onclick: closeDialog}),
      btn('Reemplazar datos', {raised: true, icon:'check', onclick: applyImport}),
    ],
    lg: true,
  });
}

function undoImport() {
  try {
    const raw = localStorage.getItem('i2t_planning_v4_backup');
    if (!raw) { snackbar('No hay backup disponible para restaurar'); return; }
    const parsed = JSON.parse(raw);
    if (!parsed?.people || !parsed?.projects) throw new Error('Backup corrupto');
    state.data = parsed;
    saveState();
    render();
    snackbar('Datos restaurados desde backup');
  } catch(e) {
    snackbar('Error al deshacer: ' + e.message);
  }
}

function exportCSV() {
  const rows = [['Persona','Sección','Proyecto','Comentario','Mes','Semana','SlotIndex']];
  state.data.people.forEach(p => {
    p.lanes.forEach(l => {
      l.forEach((s, idx) => {
        const proj = slotProject(s);
        if (!proj) return;
        rows.push([
          p.name, p.category, proj, slotComment(s),
          state.data.meses[Math.floor(idx/WEEKS_PER_MONTH)],
          WEEK_LABELS[idx % WEEKS_PER_MONTH],
          idx
        ]);
      });
    });
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  downloadBlob(new Blob(['\ufeff' + csv], {type:'text/csv'}), 'cronograma_2026.csv');
  snackbar('CSV descargado');
}

function exportJSON() {
  const json = JSON.stringify(state.data, null, 2);
  downloadBlob(new Blob([json], {type:'application/json'}), 'cronograma_2026_backup.json');
  snackbar('JSON descargado — guardalo como backup');
}

async function exportXLSX() {
  if (typeof ExcelJS === 'undefined') {
    snackbar('La librería de Excel aún se está cargando, intentá de nuevo en un segundo');
    return;
  }
  snackbar('Generando archivo Excel...');

  const wb = new ExcelJS.Workbook();
  wb.creator = 'i2T - Cronograma 2026';
  wb.created = new Date();
  wb.modified = new Date();

  // ===== Helpers =====
  const argbFromHex = (hex) => 'FF' + hex.replace('#','').toUpperCase();
  const projectArgb = (name) => {
    const c = projectColor(name);
    return {
      bg: argbFromHex(c.light),
      fg: argbFromHex(c.text),
      side: argbFromHex(c.dark),
    };
  };
  const thinBorder = { style: 'thin', color: { argb: 'FFE0E0E0' } };
  const headerFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF3F51B5' } };
  const headerSemFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF303F9F' } };

  // Dimensiones dinámicas
  const NM = state.data.meses.length;                  // p.ej. 8 meses
  const N_SLOTS = NM * WEEKS_PER_MONTH;                // p.ej. 32 semanas
  const LAST_COL = 1 + N_SLOTS;                        // columna de cierre del cronograma

  // =================================================================
  // HOJA 1: CRONOGRAMA (formato visual tipo Gantt)
  // =================================================================
  const ws = wb.addWorksheet('Cronograma', {
    views: [{ state: 'frozen', xSplit: 1, ySplit: 2 }],
    pageSetup: { orientation: 'landscape', fitToPage: true, fitToWidth: 1 },
  });

  // Header row 1: meses (cada uno merge de WEEKS_PER_MONTH columnas: B-E, F-I, ...)
  ws.getCell(1, 1).value = 'Recurso';
  state.data.meses.forEach((q, i) => {
    const col1 = 2 + i*WEEKS_PER_MONTH, col2 = col1 + WEEKS_PER_MONTH - 1;
    ws.mergeCells(1, col1, 1, col2);
    ws.getCell(1, col1).value = q;
  });
  // Estilo del header de meses
  for (let c = 1; c <= LAST_COL; c++) {
    const cell = ws.getCell(1, c);
    cell.fill = headerFill;
    cell.font = { color: {argb:'FFFFFFFF'}, bold: true, size: 12, name: 'Roboto' };
    cell.alignment = { horizontal: 'center', vertical: 'middle' };
    cell.border = { top: thinBorder, left: thinBorder, bottom: thinBorder, right: thinBorder };
  }

  // Row 2: semanas (S1/S2/S3/S4)
  for (let i = 0; i < N_SLOTS; i++) {
    const cell = ws.getCell(2, 2 + i);
    cell.value = WEEK_LABELS[i % WEEKS_PER_MONTH];
    cell.fill = headerSemFill;
    cell.font = { color: {argb:'FFFFFFFF'}, size: 9, name: 'Roboto' };
    cell.alignment = { horizontal: 'center', vertical: 'middle' };
    cell.border = { top: thinBorder, left: thinBorder, bottom: thinBorder, right: thinBorder };
  }
  // Mergear "Recurso" sobre fila 1 y 2
  ws.mergeCells(1, 1, 2, 1);

  // Filas: agrupadas por categoría
  let rowIdx = 3;
  CATS.forEach(cat => {
    const peopleInCat = state.data.people.filter(p => p.category === cat);
    if (peopleInCat.length === 0) return;

    // Header de categoría (mergeada toda la fila)
    ws.mergeCells(rowIdx, 1, rowIdx, LAST_COL);
    const catCell = ws.getCell(rowIdx, 1);
    catCell.value = `▸ ${cat}  (${peopleInCat.length})`;
    catCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: argbFromHex(CAT_COLORS[cat]) } };
    catCell.font = { color: {argb:'FFFFFFFF'}, bold: true, size: 10, name: 'Roboto' };
    catCell.alignment = { vertical: 'middle', indent: 1 };
    ws.getRow(rowIdx).height = 22;
    rowIdx++;

    peopleInCat.forEach(person => {
      const personStartRow = rowIdx;
      person.lanes.forEach((lane) => {
        // Calcular segmentos contiguos en este carril
        const segs = [];
        let i = 0;
        while (i < N_SLOTS) {
          const v = lane[i];
          if (!v) { i++; continue; }
          let j = i;
          while (j < N_SLOTS && sameSlot(lane[j], lane[i])) j++;
          segs.push({ start: i, end: j-1, project: slotProject(v), comment: slotComment(v) });
          i = j;
        }
        // Pintar cada segmento (con merge si abarca > 1 slot)
        segs.forEach(seg => {
          const col1 = 2 + seg.start, col2 = 2 + seg.end;
          if (col1 !== col2) ws.mergeCells(rowIdx, col1, rowIdx, col2);
          const cell = ws.getCell(rowIdx, col1);
          // Si hay comentario, mostrar "Proyecto\n— Comentario" en la celda
          if (seg.comment) {
            cell.value = {
              richText: [
                { text: seg.project, font: { bold: true, size: 10, name: 'Roboto' } },
                { text: '\n', font: { size: 10, name: 'Roboto' } },
                { text: seg.comment, font: { italic: true, size: 9, name: 'Roboto' } },
              ]
            };
          } else {
            cell.value = seg.project;
          }
          const c = projectArgb(seg.project);
          cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: c.bg } };
          cell.font = { color: {argb: c.fg}, size: 10, bold: true, name: 'Roboto' };
          cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
          cell.border = {
            top: thinBorder, bottom: thinBorder, right: thinBorder,
            left: { style: 'medium', color: { argb: c.side } },
          };
        });
        // Las celdas vacías mantienen bordes sutiles para el grid
        for (let s = 0; s < N_SLOTS; s++) {
          if (!lane[s]) {
            const cell = ws.getCell(rowIdx, 2 + s);
            cell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
          }
        }
        // Aumentar altura si hay comentarios en este lane
        const hasComments = segs.some(s => s.comment);
        ws.getRow(rowIdx).height = hasComments ? 40 : 28;
        rowIdx++;
      });
      // Mergear el nombre del recurso si tiene varios carriles
      if (person.lanes.length > 1) {
        ws.mergeCells(personStartRow, 1, rowIdx - 1, 1);
      }
      const nameCell = ws.getCell(personStartRow, 1);
      nameCell.value = person.name + (person.lanes.length > 1 ? `\n(${person.lanes.length} carriles)` : '');
      nameCell.font = { bold: true, size: 11, name: 'Roboto' };
      nameCell.alignment = { vertical: 'middle', horizontal: 'left', indent: 1, wrapText: true };
      nameCell.border = {
        top: thinBorder, bottom: thinBorder, left: thinBorder,
        right: { style: 'medium', color: { argb: 'FF3F51B5' } },
      };
      nameCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFAFAFA' } };
    });
  });

  // Anchos de columna
  ws.getColumn(1).width = 24;
  for (let i = 2; i <= LAST_COL; i++) ws.getColumn(i).width = 11;

  // =================================================================
  // HOJA: GANTT POR PROYECTO (mismo formato visual, pero agrupado por proyecto)
  // =================================================================
  // Para cada proyecto: una fila por cada recurso que tenga al menos un slot en él.
  // Cada fila muestra solamente los segmentos de ESE proyecto en la línea de tiempo.
  const wsByProj = wb.addWorksheet('Gantt por Proyecto', {
    views: [{ state: 'frozen', xSplit: 1, ySplit: 2 }],
    pageSetup: { orientation: 'landscape', fitToPage: true, fitToWidth: 1 },
  });

  // Header row 1: meses
  wsByProj.getCell(1, 1).value = 'Proyecto / Recurso';
  state.data.meses.forEach((q, i) => {
    const col1 = 2 + i*WEEKS_PER_MONTH, col2 = col1 + WEEKS_PER_MONTH - 1;
    wsByProj.mergeCells(1, col1, 1, col2);
    wsByProj.getCell(1, col1).value = q;
  });
  for (let c = 1; c <= LAST_COL; c++) {
    const cell = wsByProj.getCell(1, c);
    cell.fill = headerFill;
    cell.font = { color: {argb:'FFFFFFFF'}, bold: true, size: 12, name: 'Roboto' };
    cell.alignment = { horizontal: 'center', vertical: 'middle' };
    cell.border = { top: thinBorder, left: thinBorder, bottom: thinBorder, right: thinBorder };
  }
  // Row 2: semanas
  for (let i = 0; i < N_SLOTS; i++) {
    const cell = wsByProj.getCell(2, 2 + i);
    cell.value = WEEK_LABELS[i % WEEKS_PER_MONTH];
    cell.fill = headerSemFill;
    cell.font = { color: {argb:'FFFFFFFF'}, size: 9, name: 'Roboto' };
    cell.alignment = { horizontal: 'center', vertical: 'middle' };
    cell.border = { top: thinBorder, left: thinBorder, bottom: thinBorder, right: thinBorder };
  }
  wsByProj.mergeCells(1, 1, 2, 1);

  // Construir mapa proyecto → [{person, lane (idx), segments}]
  // Cada combinación (persona, carril) que tenga slots de un proyecto da una fila.
  // Si una persona tiene el mismo proyecto en dos carriles, son dos filas.
  const projectRows = {}; // projectName → [{ person, laneIdx, segments }]
  state.data.people.forEach(person => {
    person.lanes.forEach((lane, laneIdx) => {
      // Detectar segmentos contiguos por proyecto en este carril
      let i = 0;
      while (i < N_SLOTS) {
        const v = lane[i];
        if (!v) { i++; continue; }
        let j = i;
        while (j < N_SLOTS && sameSlot(lane[j], lane[i])) j++;
        const proj = slotProject(v);
        if (proj) {
          if (!projectRows[proj]) projectRows[proj] = [];
          // Buscar si ya existe una entrada para esta (persona, carril) en este proyecto
          let entry = projectRows[proj].find(e => e.person.id === person.id && e.laneIdx === laneIdx);
          if (!entry) {
            entry = { person, laneIdx, segments: [] };
            projectRows[proj].push(entry);
          }
          entry.segments.push({ start: i, end: j-1, project: proj, comment: slotComment(v) });
        }
        i = j;
      }
    });
  });

  // Ordenar proyectos alfabéticamente, vacaciones al final
  const projectNames = Object.keys(projectRows).sort((a, b) => {
    const aVac = isVacacion(a), bVac = isVacacion(b);
    if (aVac && !bVac) return 1;
    if (!aVac && bVac) return -1;
    return a.localeCompare(b);
  });

  let pRowIdx = 3;
  projectNames.forEach(projName => {
    const rows = projectRows[projName];
    const c = projectArgb(projName);

    // Header de proyecto (mergeada toda la fila), con su color
    wsByProj.mergeCells(pRowIdx, 1, pRowIdx, LAST_COL);
    const projCell = wsByProj.getCell(pRowIdx, 1);
    projCell.value = `▸ ${projName}  (${rows.length} ${rows.length === 1 ? 'recurso' : 'recursos'})`;
    projCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: c.side } };
    projCell.font = { color: {argb:'FFFFFFFF'}, bold: true, size: 11, name: 'Roboto' };
    projCell.alignment = { vertical: 'middle', indent: 1 };
    wsByProj.getRow(pRowIdx).height = 22;
    pRowIdx++;

    // Ordenar filas: por categoría (igual orden que CATS) y luego por nombre
    rows.sort((a, b) =>
      CATS.indexOf(a.person.category) - CATS.indexOf(b.person.category) ||
      a.person.name.localeCompare(b.person.name) ||
      a.laneIdx - b.laneIdx
    );

    rows.forEach(({ person, laneIdx, segments }) => {
      // Pintar segmentos de este recurso para este proyecto
      segments.forEach(seg => {
        const col1 = 2 + seg.start, col2 = 2 + seg.end;
        if (col1 !== col2) wsByProj.mergeCells(pRowIdx, col1, pRowIdx, col2);
        const cell = wsByProj.getCell(pRowIdx, col1);
        // En esta hoja el contexto es el proyecto, así que mostramos el nombre del recurso
        // (más útil que repetir el del proyecto). Si hay comentario, va abajo.
        if (seg.comment) {
          cell.value = {
            richText: [
              { text: person.name, font: { bold: true, size: 10, name: 'Roboto' } },
              { text: '\n', font: { size: 10, name: 'Roboto' } },
              { text: seg.comment, font: { italic: true, size: 9, name: 'Roboto' } },
            ]
          };
        } else {
          cell.value = person.name;
        }
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: c.bg } };
        cell.font = { color: {argb: c.fg}, size: 10, bold: true, name: 'Roboto' };
        cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
        cell.border = {
          top: thinBorder, bottom: thinBorder, right: thinBorder,
          left: { style: 'medium', color: { argb: c.side } },
        };
      });
      // Bordes sutiles en celdas vacías
      const occupied = new Set();
      segments.forEach(s => { for (let k = s.start; k <= s.end; k++) occupied.add(k); });
      for (let s = 0; s < N_SLOTS; s++) {
        if (!occupied.has(s)) {
          const cell = wsByProj.getCell(pRowIdx, 2 + s);
          cell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
        }
      }

      // Columna 1: nombre del recurso (útil cuando lee la fila a primera vista) + categoría
      // y, si es necesario, distinguir el carril.
      const nameCell = wsByProj.getCell(pRowIdx, 1);
      const laneSuffix = person.lanes.length > 1 ? ` · C${laneIdx+1}` : '';
      nameCell.value = `${person.name}${laneSuffix}\n${person.category}`;
      nameCell.font = { bold: true, size: 10, name: 'Roboto' };
      nameCell.alignment = { vertical: 'middle', horizontal: 'left', indent: 1, wrapText: true };
      nameCell.border = {
        top: thinBorder, bottom: thinBorder, left: thinBorder,
        right: { style: 'medium', color: { argb: 'FF3F51B5' } },
      };
      // Tinte sutil de la categoría a la izquierda
      const catColor = argbFromHex(CAT_COLORS[person.category]);
      nameCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFAFAFA' } };
      // Una marca de color de categoría como pequeño detalle visual: el border-left del nombre
      // ya lo provee el primary color, así que dejamos así.

      // Altura ajustada si hay comentarios o si hay nombre largo + categoría
      const hasComments = segments.some(s => s.comment);
      wsByProj.getRow(pRowIdx).height = hasComments ? 36 : 30;
      pRowIdx++;
    });
  });

  // Anchos de columna
  wsByProj.getColumn(1).width = 26;
  for (let i = 2; i <= LAST_COL; i++) wsByProj.getColumn(i).width = 11;

  // =================================================================
  // HOJA 2: PROYECTOS (catálogo, sin tipo)
  // =================================================================
  const wsP = wb.addWorksheet('Proyectos', { views: [{ state: 'frozen', ySplit: 1 }] });
  wsP.columns = [
    { header: 'ID', key: 'id', width: 8 },
    { header: 'Nombre', key: 'name', width: 32 },
    { header: 'Personas asignadas', key: 'people', width: 20 },
    { header: 'Meses activos', key: 'q', width: 18 },
  ];
  // Sort alfabético
  const projsSorted = [...state.data.projects].sort((a,b) => a.name.localeCompare(b.name));
  projsSorted.forEach(p => {
    const stats = getProjectStats(p.name);
    const row = wsP.addRow({
      id: p.id, name: p.name,
      people: stats.peopleCount, q: stats.quincenaCount,
    });
    // Color del proyecto en la celda Nombre
    const c = projectArgb(p.name);
    row.getCell(2).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: c.bg } };
    row.getCell(2).font = { color: {argb: c.fg}, bold: true, name: 'Roboto' };
  });
  styleHeader(wsP, 4);

  // =================================================================
  // HOJA 3: RECURSOS (catálogo)
  // =================================================================
  const wsR = wb.addWorksheet('Recursos', { views: [{ state: 'frozen', ySplit: 1 }] });
  wsR.columns = [
    { header: 'ID', key: 'id', width: 8 },
    { header: 'Nombre', key: 'name', width: 22 },
    { header: 'Sección', key: 'cat', width: 22 },
    { header: 'Carriles', key: 'lanes', width: 12 },
    { header: 'Asignaciones', key: 'asg', width: 14 },
    { header: 'Proyectos distintos', key: 'projs', width: 18 },
  ];
  const peopleSorted = [...state.data.people].sort((a,b) => CATS.indexOf(a.category) - CATS.indexOf(b.category) || a.name.localeCompare(b.name));
  peopleSorted.forEach(p => {
    const stats = getPersonStats(p.id);
    const row = wsR.addRow({
      id: p.id, name: p.name, cat: p.category,
      lanes: stats.lanes, asg: stats.assignments, projs: stats.projects,
    });
    // Color de la sección
    row.getCell(3).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: argbFromHex(CAT_COLORS[p.category]) } };
    row.getCell(3).font = { color: {argb:'FFFFFFFF'}, bold: true, name: 'Roboto', size: 10 };
    row.getCell(3).alignment = { horizontal: 'center' };
  });
  styleHeader(wsR, 6);

  // =================================================================
  // HOJA 4: ASIGNACIONES (flat - una fila por slot asignado)
  // =================================================================
  const wsA = wb.addWorksheet('Asignaciones', { views: [{ state: 'frozen', ySplit: 1 }] });
  wsA.columns = [
    { header: 'Persona', key: 'p', width: 18 },
    { header: 'Sección', key: 'c', width: 20 },
    { header: 'Proyecto', key: 'pr', width: 28 },
    { header: 'Comentario', key: 'cm', width: 36 },
    { header: 'Mes', key: 'q', width: 12 },
    { header: 'Semana', key: 's', width: 8 },
    { header: 'Slot', key: 'slot', width: 8 },
  ];
  state.data.people.forEach(p => {
    p.lanes.forEach(l => {
      l.forEach((s, idx) => {
        const proj = slotProject(s);
        if (!proj) return;
        const row = wsA.addRow({
          p: p.name, c: p.category, pr: proj,
          cm: slotComment(s),
          q: state.data.meses[Math.floor(idx/WEEKS_PER_MONTH)],
          s: WEEK_LABELS[idx % WEEKS_PER_MONTH],
          slot: idx,
        });
        const c = projectArgb(proj);
        row.getCell(3).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: c.bg } };
        row.getCell(3).font = { color: {argb: c.fg}, name: 'Roboto', size: 10, bold: true };
        // Comentario en cursiva
        if (slotComment(s)) {
          row.getCell(4).font = { italic: true, name: 'Roboto', size: 10, color: {argb: 'FF555555'} };
          row.getCell(4).alignment = { wrapText: true, vertical: 'middle' };
        }
      });
    });
  });
  styleHeader(wsA, 7);
  wsA.autoFilter = 'A1:G1';

  // =================================================================
  // HOJA 5: CONFLICTOS (si hay)
  // =================================================================
  const conflicts = detectConflicts(state.data);
  if (conflicts.length > 0) {
    const wsC = wb.addWorksheet('Conflictos', { views: [{ state: 'frozen', ySplit: 1 }] });
    wsC.columns = [
      { header: 'Persona', key: 'p', width: 20 },
      { header: 'Sección', key: 'c', width: 22 },
      { header: 'Quincena', key: 'q', width: 14 },
      { header: 'Simultáneos', key: 's', width: 14 },
      { header: 'Proyectos en simultáneo', key: 'pr', width: 60 },
    ];
    conflicts.forEach(cf => {
      const row = wsC.addRow({
        p: cf.person, c: cf.category, q: cf.quincena,
        s: cf.count, pr: cf.projects.join(' · '),
      });
      row.getCell(4).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFE0B2' } };
      row.getCell(4).font = { color: {argb: 'FFE65100'}, bold: true, name: 'Roboto' };
      row.getCell(4).alignment = { horizontal: 'center' };
    });
    // Header en color warn
    const hdr = wsC.getRow(1);
    hdr.eachCell(c => {
      c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFF9800' } };
      c.font = { color: {argb:'FFFFFFFF'}, bold: true, name: 'Roboto' };
      c.alignment = { horizontal: 'center', vertical: 'middle' };
    });
    hdr.height = 32;
    wsC.autoFilter = 'A1:E1';
  }

  // =================================================================
  // Hoja "Resumen" (info al inicio)
  // =================================================================
  const wsInfo = wb.addWorksheet('Resumen', { views: [{ showGridLines: false }] });
  wsInfo.getCell('B2').value = 'Cronograma de Recursos · 1er Semestre 2026';
  wsInfo.getCell('B2').font = { size: 22, bold: true, color: {argb:'FF3F51B5'}, name: 'Roboto' };
  wsInfo.getCell('B3').value = 'i2T S.A. · Generado el ' + new Date().toLocaleString('es-AR');
  wsInfo.getCell('B3').font = { size: 11, color: {argb:'FF666666'}, italic: true, name: 'Roboto' };

  const totalAssign = state.data.people.reduce((a,p) => a + p.lanes.reduce((b,l) => b + l.filter(v=>v).length, 0), 0);
  const summary = [
    ['Recursos', state.data.people.length],
    ['Proyectos', state.data.projects.length],
    ['Asignaciones', totalAssign],
    ['Conflictos detectados', conflicts.length],
  ];
  summary.forEach((row, i) => {
    const r = 6 + i;
    wsInfo.getCell(`B${r}`).value = row[0];
    wsInfo.getCell(`B${r}`).font = { size: 11, color: {argb:'FF666666'}, name: 'Roboto' };
    wsInfo.getCell(`C${r}`).value = row[1];
    wsInfo.getCell(`C${r}`).font = { size: 14, bold: true, name: 'Roboto', color: {argb: i === 3 && row[1] > 0 ? 'FFD32F2F' : 'FF1A1A1A'} };
  });
  wsInfo.getCell('B12').value = 'Hojas en este archivo:';
  wsInfo.getCell('B12').font = { size: 12, bold: true, name: 'Roboto' };
  const sheetsInfo = [
    ['Cronograma', 'Vista visual tipo Gantt, agrupada por sección/recurso'],
    ['Gantt por Proyecto', 'Misma línea de tiempo, pero agrupando por proyecto y mostrando sus recursos'],
    ['Proyectos', 'Catálogo completo de proyectos con conteo de uso'],
    ['Recursos', 'Catálogo completo de recursos con métricas por persona'],
    ['Asignaciones', 'Tabla plana — una fila por asignación. Soporta filtros y pivots'],
  ];
  if (conflicts.length > 0) sheetsInfo.push(['Conflictos', 'Detección de personas con > 2 proyectos paralelos']);
  sheetsInfo.forEach((row, i) => {
    const r = 13 + i;
    wsInfo.getCell(`B${r}`).value = '· ' + row[0];
    wsInfo.getCell(`B${r}`).font = { size: 11, bold: true, name: 'Roboto', color: {argb: 'FF3F51B5'} };
    wsInfo.getCell(`C${r}`).value = row[1];
    wsInfo.getCell(`C${r}`).font = { size: 11, name: 'Roboto', color: {argb: 'FF666666'} };
  });
  wsInfo.getColumn('B').width = 26;
  wsInfo.getColumn('C').width = 70;

  // Reordenar para que "Resumen" sea la primera
  wb.worksheets = [wsInfo, ws, wsByProj, wsP, wsR, wsA, ...(conflicts.length > 0 ? [wb.getWorksheet('Conflictos')] : [])];

  // Generar y descargar
  try {
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], {
      type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
    });
    const today = new Date().toISOString().slice(0, 10);
    downloadBlob(blob, `cronograma_2026_${today}.xlsx`);
    snackbar('Excel descargado correctamente');
  } catch (err) {
    console.error(err);
    snackbar('Error al generar el Excel: ' + err.message);
  }
}

function styleHeader(ws, lastCol) {
  const hdr = ws.getRow(1);
  hdr.height = 32;
  for (let c = 1; c <= lastCol; c++) {
    const cell = hdr.getCell(c);
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF3F51B5' } };
    cell.font = { color: {argb:'FFFFFFFF'}, bold: true, name: 'Roboto', size: 11 };
    cell.alignment = { horizontal: 'center', vertical: 'middle' };
  }
}

// ============ MAIN RENDER ============
function render() {
  $('#main').innerHTML = '';
  renderMetrics();
  // Update tab active state
  $$('#tabs .mat-tab').forEach(b => b.classList.toggle('active', b.dataset.view === state.view));

  if (state.view === 'gantt') renderGantt();
  else if (state.view === 'projects-view') renderProjectsView();
  else if (state.view === 'projects-crud') renderProjectsCrud();
  else if (state.view === 'people-crud') renderPeopleCrud();

  renderFab();
}

// ============ EVENTS ============
$$('#tabs .mat-tab').forEach(b => {
  b.addEventListener('click', () => { state.view = b.dataset.view; state.search = ''; state.searchApplied = ''; render(); });
});
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDialog();
});

// Init: render inmediato con cache local (rápido), después loadState() async
// puede actualizar el state con datos del backend y hacer un re-render.
render();
loadState().then(() => {
  render();
  // Después de cargar datos, si no hay nombre, exigirlo con diálogo bloqueante.
  // El usuario no puede hacer cambios hasta completarlo.
  if (!getUserName()) {
    ensureUserNamePresent().then(() => updateSyncIndicator());
  }
}).catch(err => {
  console.error('Init error:', err);
  // Aún si la carga falla, exigir el nombre
  if (!getUserName()) ensureUserNamePresent().then(() => updateSyncIndicator());
});
</script>

</body>
</html>
